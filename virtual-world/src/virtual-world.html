<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3: Virtual World</title>
    <link rel="stylesheet" href="virtual-world.css">
</head>
<body onload="main()">
    <h1>Assignment 3: Virtual World</h1>
    <div class="main-container">
        <div id="game-ui" style="color: #ffca28; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; text-align: center;">
            QUEST: Find the Golden Diamond guarded by the Scorpion!
        </div>
        <div style="position: relative;">
            <canvas id="webgl" width="700" height="700"></canvas>
            <div style="position: absolute; top: 50%; left: 50%; width: 15px; height: 15px; 
                        border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); 
                        pointer-events: none; mix-blend-mode: difference;"></div>
        </div>
        <p id="perf">ms: 0.0 | FPS: 0</p>
        <div class="controls">
            <div class="tip">
                <div style="display: flex; justify-content: space-around; margin-bottom: 10px;">
                    <div>
                        <b style="color: #4fc3f7;">Movement</b><br>
                        <strong>WASD / Arrows:</strong> Walk<br>
                        <strong>Space / Z:</strong> Fly Up/Down
                    </div>
                    <div>
                        <b style="color: #4fc3f7;">Camera</b><br>
                        <strong>Q / E:</strong> Pan Left/Right<br>
                        <strong>Mouse Drag:</strong> Look Around
                    </div>
                    <div>
                        <b style="color: #4fc3f7;">Actions</b><br>
                        <strong>Click:</strong> Add Block<br>
                        <strong>Shift+Click:</strong> Delete<br>
                        <strong>X:</strong> Scorpion Strike
                    </div>
                </div>
            </div>
            <hr class="card-divider">
            <div class="home-link-container">
                <a href="../../index.html" class="home-link">&larr; Back to Portfolio Home</a>
            </div>
        </div>
    </div>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix-cse160.js"></script>
    <script src="Camera.js"></script>
    <script src="Cube.js"></script>
    <script src="Pyramid.js"></script>
    <script src="virtual-world.js"></script>
</body>
</html>
